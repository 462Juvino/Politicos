<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
    <title>BomBa BomBa - Tela</title>
    <style>
        body { background-color: transparent; background-size: cover; background-position: center center; background-repeat: no-repeat; height: 100vh; width: 100vw; overflow: hidden; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; transition: background 0.5s ease;}

        .aguardando { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: #fff; font-size: 2rem; font-weight: bold; text-shadow: 0 0 10px black; z-index: 10;}

        #overlay-countdown {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.7); z-index: 1000;
            display: none; justify-content: center; align-items: center;
            font-size: 15rem; font-weight: 900; color: #f39c12;
            text-shadow: 0 0 40px #f39c12, 0 0 10px #fff;
            animation: pulseCount 0.5s infinite alternate;
            text-transform: uppercase;
        }
        @keyframes pulseCount { from { transform: scale(1); } to { transform: scale(1.15); } }

        #game-view { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; overflow: hidden; }
        #game-zoom-area { width: 100%; height: 100%; position: absolute; top: 0; left: 0; transform-origin: top center; transition: transform 0.2s ease-out; }
        .roda-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;}
        .player-roda-container { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; transition: all 0.5s ease; }
        .avatar-roda { width: 55px; height: 55px; border-radius: 50%; border: 3px solid #555; object-fit: cover; background-color: #222; }

        .nome-roda-container { display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.8); border: 1px solid #30363d; border-radius: 8px; padding: 2px 6px; margin-top: 5px; }
        .nome-texto { color: white; font-size: 0.7rem; font-weight: bold; max-width: 60px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
        .ticket-badge { color: gold; font-size: 0.75rem; font-weight: bold; margin-left: 4px; flex-shrink: 0; text-shadow: 0 0 5px gold; }
        .colete-badge { color: #3498db; font-size: 0.75rem; font-weight: bold; margin-left: 4px; flex-shrink: 0; text-shadow: 0 0 5px #3498db; }


        .centro-bomba { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 10; display: flex; flex-direction: column; align-items: center; transition: transform 0.1s ease-out;}
        .silaba-display { background: rgba(9, 50, 125, 0.85); padding: 5px 25px; border-radius: 12px; font-size: 1.8rem; font-weight: 900; letter-spacing: 2px; box-shadow: 0 4px 10px rgba(0,0,0,0.6); text-transform: uppercase; border: 2px solid #3498db; backdrop-filter: blur(5px); z-index: 100; margin-bottom: 12px; }
        .jogador-ativo-container { position: relative; width: 180px; height: 180px; display: flex; justify-content: center; align-items: center; }
        .img-wrapper { width: 140px; height: 140px; border-radius: 50%; overflow: hidden; position: relative; z-index: 2; background-color: #222; display: flex; justify-content: center; align-items: center; }
        .img-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        .progress-ring { position: absolute; top: 0; left: 0; transform: rotate(-90deg); z-index: 1; }
        .progress-ring__circle { transition: stroke-dashoffset 1s linear, stroke 0.5s ease; stroke-dasharray: 502; stroke-dashoffset: 0; fill: transparent; stroke-width: 12; stroke-linecap: round; stroke: #f39c12; filter: drop-shadow(0 0 10px rgba(243, 156, 18, 0.8)); }

        .nick-ativo-container { display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.8); padding: 5px 20px; border-radius: 20px; border: 2px solid #30363d; margin-top: -15px; position: relative; z-index: 10; }
        .nick-ativo-texto { font-size: 1.4rem; font-weight: bold; max-width: 140px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: white; }
        .nick-ativo-ticket { font-size: 1.4rem; font-weight: bold; color: gold; margin-left: 8px; flex-shrink: 0; text-shadow: 0 0 10px gold; }

        .tempo-restante { font-size: 3.5rem; color: #f39c12; font-weight: 900; margin-top: 10px; text-shadow: 0 0 15px rgba(243, 156, 18, 0.8);}
        .explosao-overlay { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: radial-gradient(circle, rgba(255,71,87,0.8) 0%, rgba(0,0,0,0) 80%); opacity: 0; pointer-events: none; z-index: 50; transition: opacity 0.2s;}
        .avatar-boom-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.1); font-size: 180px; z-index: 999; pointer-events: none; animation: centerBoom 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; filter: drop-shadow(0 0 30px rgba(255, 69, 0, 1)); }
        @keyframes centerBoom { 0% { transform: translate(-50%, -50%) scale(0.1) rotate(-20deg); opacity: 1; } 50% { transform: translate(-50%, -50%) scale(2.5) rotate(10deg); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(3.5) rotate(20deg); opacity: 0; } }

        .tela-vencedor { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px); z-index: 900; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.5s ease; }
        .tela-vencedor.show { opacity: 1; pointer-events: auto; }
        .titulo-vencedor { font-size: 5rem; color: gold; font-weight: 900; margin-bottom: 20px; text-shadow: 0 0 20px gold, 0 0 40px darkgoldenrod; text-transform: uppercase; animation: bounce 1s infinite alternate; }
        .vencedor-avatar { width: 180px; height: 180px; border-radius: 50%; border: 8px solid gold; box-shadow: 0 0 30px gold; object-fit: cover; margin-bottom: 15px; }
        .vencedor-nick { font-size: 2.5rem; font-weight: bold; background: #111; padding: 10px 30px; border-radius: 20px; border: 2px solid gold; margin-bottom: 30px; }
        .vencedor-stats { display: flex; gap: 40px; text-align: center; }
        .stat-box { background: rgba(255,255,255,0.1); padding: 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.2); min-width: 200px; max-width: 400px; }
        .stat-box h3 { margin: 0 0 10px 0; color: #2ed573; font-size: 1.5rem; }
        .stat-box p { margin: 0; font-size: 1.2rem; font-weight: bold; word-wrap: break-word; }
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-10px); } }

        .aviso-popup { position: absolute; top: 75%; left: 50%; transform: translate(-50%, -50%); background: rgba(255, 71, 87, 0.95); color: white; padding: 15px 40px; border-radius: 12px; font-size: 2rem; font-weight: 900; letter-spacing: 2px; z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.2s; border: 3px solid white; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-transform: uppercase; }

        #ranking-view { display: none; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; flex-direction: column; align-items: center; justify-content: center; z-index: 800; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); }
        .ranking-title { font-size: 3.5rem; font-weight: 900; margin-bottom: 5px; text-transform: uppercase; text-shadow: 0 0 20px rgba(255,255,255,0.5); display: flex; align-items: center; gap: 20px; }
        .ranking-subtitle { font-size: 1.3rem; font-weight: bold; color: #f39c12; margin-bottom: 20px; background: rgba(0,0,0,0.8); padding: 5px 20px; border-radius: 20px; border: 1px solid #f39c12;}
        .ranking-list { background: rgba(20, 25, 35, 0.9); border: 2px solid #444; border-radius: 20px; width: 85%; max-width: 850px; padding: 20px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); max-height: 60vh; overflow-y: auto; }

        .rank-item { display: flex; align-items: center; background: rgba(255,255,255,0.05); padding: 12px 20px; border-radius: 12px; border-left: 5px solid transparent; transition: transform 0.2s; }
        .rank-item:hover { transform: scale(1.01); background: rgba(255,255,255,0.1); }
        .rank-pos { font-size: 1.8rem; font-weight: 900; width: 45px; text-align: center; color: #888; }
        .rank-item.pos-1 { border-left-color: gold; background: linear-gradient(90deg, rgba(255,215,0,0.2) 0%, rgba(0,0,0,0) 100%); }
        .rank-item.pos-1 .rank-pos { color: gold; }
        .rank-item.pos-2 { border-left-color: silver; }
        .rank-item.pos-2 .rank-pos { color: silver; }
        .rank-item.pos-3 { border-left-color: #cd7f32; }
        .rank-item.pos-3 .rank-pos { color: #cd7f32; }
        .rank-avatar { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; margin-left: 10px; border: 2px solid #555; }
        .rank-name { flex: 1; font-size: 1.5rem; font-weight: bold; margin-left: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .rank-side-badge { padding: 4px 12px; border-radius: 15px; font-weight: bold; font-size: 0.9rem; margin-right: 15px; }
        .side-l { background: rgba(255, 71, 87, 0.2); border: 1px solid #ff4757; color: #ff4757; }
        .side-b { background: rgba(46, 213, 115, 0.2); border: 1px solid #2ed573; color: #2ed573; }
        .rank-score { font-size: 1.8rem; font-weight: 900; color: #f39c12; }

        /* Estilos do Placar L vs B */
        .placar-confronto { display: flex; gap: 40px; justify-content: center; align-items: center; width: 100%; padding: 20px 0; }
        .card-lutador { flex: 1; max-width: 350px; background: rgba(15, 20, 30, 0.9); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .card-lutador.card-l { border: 3px solid #ff4757; }
        .card-lutador.card-b { border: 3px solid #2ed573; }
        .card-lutador img { width: 130px; height: 130px; border-radius: 50%; object-fit: cover; margin-bottom: 15px; }
        .card-lutador.card-l img { border: 4px solid #ff4757; box-shadow: 0 0 20px rgba(255, 71, 87, 0.5); }
        .card-lutador.card-b img { border: 4px solid #2ed573; box-shadow: 0 0 20px rgba(46, 213, 115, 0.5); }
        .card-lutador h3 { margin: 0 0 10px 0; font-size: 2rem; text-transform: uppercase; }
        .card-lutador .placar-vitorias { font-size: 3.5rem; font-weight: 900; }
        .card-lutador.card-l .placar-vitorias { color: #ff4757; }
        .card-lutador.card-b .placar-vitorias { color: #2ed573; }
        .vs-text { font-size: 3rem; font-weight: 900; color: #f39c12; text-shadow: 0 0 15px #f39c12; }

        /* Arena de Luta Posicionada Mais Acima */
        .arena-luta {
            position: absolute;
            top: 38%; /* SUBIU BASTANTE A ARENA */
            left: 50%;
            transform: translate(-50%, -38%);
            width: 95vw;
            max-width: 1300px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 10;
        }

        .lutador-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 44%;
        }

        .hud-top {
            width: 100%;
            margin-bottom: 10px;
        }

        .hp-bar-container {
            width: 100%;
            height: 52px; /* BARRA MAIS MAJESTOSA */
            background: rgba(0, 0, 0, 0.85);
            border: 4px solid #fff;
            border-radius: 28px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(0,0,0,0.9);
        }

        .hp-texto {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-weight: 900;
            font-size: 1.8rem; /* TEXTO DE VIDA MAIOR */
            color: #fff;
            text-shadow: 0 0 8px black, 0 0 15px black;
        }

        .lutador-avatar-wrap {
            width: 380px; /* FOTO MAIOR */
            height: 380px; /* FOTO MAIOR */
            border-radius: 20px;
            overflow: hidden;
            border: 6px solid #fff;
            box-shadow: 0 10px 40px rgba(0,0,0,0.9);
            background: #111;
            transition: all 0.2s ease-out;
        }

        /* Container de Presentes e Funções abaixo das fotos */
        .lista-presentes-hud {
            width: 100%;
            margin-top: 15px;
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* DUAS COLUNAS PARA CABER NO CELULAR */
            gap: 8px;
        }

        .card-presente-hud {
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 10px 8px; /* ESTICADO NA VERTICAL (10px cima/baixo) */
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(4px);
            /* Ciclo de 14s com 10s cravados de visibilidade total */
            animation: antiStaticFade 14s infinite ease-in-out;
        }
        
        

        @keyframes antiStaticFade {
            0% { opacity: 0; transform: translateY(10px); pointer-events: none; }
            5% { opacity: 1; transform: translateY(0); pointer-events: auto; } /* Aparece */
            80% { opacity: 1; transform: translateY(0); pointer-events: auto; } /* 10 SEGUNDOS TOTALMENTE VISÍVEL */
            95% { opacity: 0; transform: translateY(-10px); pointer-events: none; } /* Desaparece suavemente */
            100% { opacity: 0; transform: translateY(-10px); pointer-events: none; }
        }
        .img-presente-hud {
            width: 28px;
            height: 28px;
            object-fit: contain;
            border-radius: 4px;
            background: rgba(255,255,255,0.1);
            flex-shrink: 0;
        }

        .info-presente-hud {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .nome-presente-hud {
            font-size: 0.75rem;
            font-weight: bold;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .funcao-presente-hud {
            font-size: 0.65rem;
            font-weight: 800;
            color: #f39c12;
            text-transform: uppercase;
        }

        .lutador-l .lutador-avatar-wrap { border-color: #ff4757; box-shadow: 0 0 35px rgba(255, 71, 87, 0.8); }
        .lutador-b .lutador-avatar-wrap { border-color: #2ed573; box-shadow: 0 0 35px rgba(46, 213, 115, 0.8); }

        .lutador-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .vs-divider {
            font-size: 6rem; /* VS GIGANTE */
            font-weight: 900;
            color: #f39c12;
            text-shadow: 0 0 25px #f39c12, 0 0 10px black;
        }

        /* ANIMAÇÕES DE IMPACTO (4 NÍVEIS) */

        /* 1. Dano Leve: Só balança */
        .shake-hit { animation: shakeAnim 0.3s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shakeAnim {
            10%, 90% { transform: translate3d(-4px, 0, 0) scale(1.05); }
            20%, 80% { transform: translate3d(6px, 0, 0) scale(1.05); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0) scale(1.05); }
            40%, 60% { transform: translate3d(8px, 0, 0) scale(1.05); }
        }

        /* 2. Dano Médio: Balança e pisca avermelhado/branco */
        .blink-hit { animation: blinkAnim 0.4s ease-in-out both; }
        @keyframes blinkAnim {
            0%, 100% { filter: brightness(1); transform: scale(1); }
            30%, 70% { filter: brightness(2) contrast(1.5) saturate(5); transform: scale(1.08) rotate(2deg); }
        }

        /* 3. Dano Grave: Porrada forte, borra e sacode brutalmente */
        .heavy-hit { animation: heavyHitAnim 0.6s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes heavyHitAnim {
            0%, 100% { filter: blur(0); transform: translate(0,0) scale(1); }
            20% { filter: blur(3px) brightness(1.5); transform: translate(-20px, 15px) scale(0.95) rotate(-5deg); }
            40% { filter: blur(2px) brightness(1.2); transform: translate(20px, -15px) scale(1.1) rotate(5deg); }
            60% { filter: blur(1px); transform: translate(-15px, -10px) scale(0.98) rotate(-2deg); }
            80% { filter: blur(0px); transform: translate(15px, 10px) scale(1.05) rotate(2deg); }
        }

        /* 4. Dano Máximo: Quebra um pedaço da ponta (borda amassa) + Inversão de cores */
        .crack-hit { animation: crackAnim 0.9s ease-in-out both; border-radius: 10% 50% 15% 60% !important; border-width: 1px 12px 2px 10px !important; }
        @keyframes crackAnim {
            0% { transform: scale(1); filter: invert(0); }
            10%, 30%, 50%, 70%, 90% { transform: translate(-15px, 10px) scale(1.15) rotate(-6deg); filter: invert(0.8) hue-rotate(180deg); }
            20%, 40%, 60%, 80% { transform: translate(15px, -10px) scale(1.15) rotate(6deg); filter: invert(1) hue-rotate(-90deg) brightness(2); }
            100% { transform: scale(1); filter: invert(0); }
        }

        .hp-bar-fill {
            height: 100%;
            width: 100%;
            transition: width 0.3s ease-in-out, background-color 0.3s;
        }

        .lutador-l .hp-bar-fill { background: linear-gradient(90deg, #ff4757, #ff6b81); }
        .lutador-b .hp-bar-fill { background: linear-gradient(90deg, #2ed573, #7bed9f); float: right; }

        .hp-texto {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-weight: 900;
            font-size: 1.2rem;
            color: #fff;
            text-shadow: 0 0 5px black, 0 0 10px black;
        }

        .lutador-avatar-wrap {
            width: 280px;
            height: 280px;
            border-radius: 20px;
            overflow: hidden;
            border: 5px solid #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            background: #111;
            transition: transform 0.1s;
        }

        .lutador-l .lutador-avatar-wrap { border-color: #ff4757; box-shadow: 0 0 25px rgba(255, 71, 87, 0.6); }
        .lutador-b .lutador-avatar-wrap { border-color: #2ed573; box-shadow: 0 0 25px rgba(46, 213, 115, 0.6); }

        .lutador-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .vs-divider {
            font-size: 4rem;
            font-weight: 900;
            color: #f39c12;
            text-shadow: 0 0 20px #f39c12, 0 0 10px black;
        }

        /* Animação de tremor ao levar golpe */
        .shake-hit {
            animation: shakeAnim 0.3s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shakeAnim {
            10%, 90% { transform: translate3d(-4px, 0, 0) scale(1.05); }
            20%, 80% { transform: translate3d(6px, 0, 0) scale(1.05); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0) scale(1.05); }
            40%, 60% { transform: translate3d(8px, 0, 0) scale(1.05); }
        }

        .lutador-nome {
            font-size: 2.8rem; /* NOME GIGANTE */
            font-weight: 900;
            margin-bottom: 8px;
            text-transform: uppercase;
            text-shadow: 0 0 15px black, 0 0 8px black;
            text-align: center !important; /* Centraliza perfeitamente acima da barra */
            width: 100%;
            background: rgba(0, 0, 0, 0.6); /* Fundo translúcido para dar destaque */
            border-radius: 12px;
            padding: 5px 0;
            border: 2px solid rgba(255, 255, 255, 0.2); /* Borda sutil */
        }

        .lutador-l .lutador-nome { color: #ff4757; box-shadow: 0 5px 15px rgba(255, 71, 87, 0.3); }
        .lutador-b .lutador-nome { color: #2ed573; box-shadow: 0 5px 15px rgba(46, 213, 115, 0.3); }

    </style>
</head>
<body>

    <div id="overlay-countdown">5</div>

    <div class="explosao-overlay" id="flash-explosao"></div>
    <div class="aviso-popup" id="aviso-popup">JÁ USADA!</div>

    <div class="tela-vencedor" id="tela-vencedor">
        <div class="titulo-vencedor">🏆 CAMPEÃO! 🏆</div>
        <img id="vencedor-avatar" class="vencedor-avatar" src="">
        <div class="vencedor-nick" id="vencedor-nick">...</div>
        <div class="vencedor-stats">
            <div class="stat-box">
                <h3 style="color: #f39c12;">⏱️ Tempo Sobrevivido</h3>
                <p id="vencedor-tempo">0s</p>
            </div>
            <div class="stat-box">
                <h3>🧠 Palavras Acertadas</h3>
                <p id="vencedor-palavras" style="font-size: 1rem; color: #ccc;">Nenhuma</p>
            </div>
        </div>
    </div>

    <div id="ranking-view">
        <div class="ranking-title" id="ranking-title">🏆 TOP JOGADORES 🏆</div>
        <div class="ranking-subtitle" id="ranking-subtitle">PERÍODO</div>
        <div class="ranking-list" id="ranking-list"></div>
    </div>

    <div id="game-zoom-area">
            <div id="video-overlay" style="display:none; position:absolute; top:0; left:0; width:100vw; height:100vh; z-index:500; background:black;">
                <video id="video-player" style="width:100%; height:100%; object-fit:contain;"></video>
            </div>

            <div class="arena-luta">
                <div class="lutador-box lutador-l">
                    <div class="hud-top">
                        <div class="lutador-nome">🔴 Lule</div>
                        <div class="hp-bar-container">
                            <div class="hp-bar-fill" id="hp-lule-fill"></div>
                            <div class="hp-texto" id="hp-lule-text">1000 / 1000</div>
                        </div>
                    </div>
                    <div class="lutador-avatar-wrap" id="wrap-lule">
                        <img id="img-lule" src="imagens/lule_base.png" class="lutador-img">
                    </div>
                    <div class="lista-presentes-hud" id="hud-presentes-lule"></div>
                </div>

                <div class="vs-divider">VS</div>

                <div class="lutador-box lutador-b">
                    <div class="hud-top">
                        <div class="lutador-nome">🟢 Bozo</div>
                        <div class="hp-bar-container">
                            <div class="hp-bar-fill" id="hp-bozo-fill"></div>
                            <div class="hp-texto" id="hp-bozo-text">1000 / 1000</div>
                        </div>
                    </div>
                    <div class="lutador-avatar-wrap" id="wrap-bozo">
                        <img id="img-bozo" src="imagens/bozo_base.png" class="lutador-img">
                    </div>

        function atualizarHUDLuta() {

        function getIconePresenteGuardado(nomePresente) {
            let icones = JSON.parse(localStorage.getItem('bombaGiftIcons') || '{}');
            let key = nomePresente.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "");
            return icones[key] || '';
        }

        function salvarIconePresente(nomePresente, urlImagem) {
            if (!urlImagem || !nomePresente) return;
            let icones = JSON.parse(localStorage.getItem('bombaGiftIcons') || '{}');
            let key = nomePresente.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "");
            if (!icones[key]) {
                icones[key] = urlImagem;

        function tocarVideoAtaque(caminhoVideo, dano, alvo) {
            if (estadoLuta.emVideo) return;

        function aplicarDano(alvo, valor) {
            const wrap = document.getElementById(alvo === 'lule' ? 'wrap-lule' : 'wrap-bozo');

            // Escolhe a animação com base no dano
            let animClass = 'shake-hit';
            if (valor >= 300) animClass = 'crack-hit';
            else if (valor >= 50) animClass = 'heavy-hit';
            else if (valor >= 10) animClass = 'blink-hit';

            wrap.classList.add(animClass);
            // Remove a classe após 900ms para garantir que a animação mais longa terminou
            setTimeout(() => wrap.classList.remove(animClass), 900);

            // Se você tiver um som para o soco básico, ele toca aqui.
            try { somHit.currentTime = 0; somHit.play(); } catch(e){}

            if (alvo === 'lule') {
                estadoLuta.hp_lule -= valor;
            } else {
                estadoLuta.hp_bozo -= valor;
            }

            atualizarHUDLuta();
            verificarFimDeLuta();
        }

            if (quem === 'lule') estadoLuta.hp_lule += valor;

        // ==========================================

        let ultimaConfigHUD = "";

        // --- NOVO: LÓGICA DO ZOOM MANUAL ---
        let zoomLevel = 1.0;

        function playTick(freq) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.1);
        }

        function playError() {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);
            osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.2);
        }

        function playVictory() {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0, now + i * 0.15);
                gain.gain.linearRampToValueAtTime(0.3, now + i * 0.15 + 0.05);
                gain.gain.linearRampToValueAtTime(0, now + i * 0.15 + 0.4);
                osc.start(now + i * 0.15); osc.stop(now + i * 0.15 + 0.4);
            });
        }

        function exibirVencedor(dados) {

        function renderizarRankingUI(modo, dataDict, periodoTexto) {
            document.getElementById('game-zoom-area').style.display = 'none';
            document.getElementById('ranking-view').style.display = 'flex';
            document.getElementById('ranking-subtitle').innerText = periodoTexto;

            const lista = document.getElementById('ranking-list');
            lista.innerHTML = '';

            if (modo === 'rank_personagens') {
                document.getElementById('ranking-title').innerHTML = "📊 PLACAR DE CONFRONTO";

                let vitL = dataDict.lule || 0;
                let vitB = dataDict.bozo || 0;

                lista.innerHTML = `
                    <div class="placar-confronto">
                        <div class="card-lutador card-l">
                            <img src="imagens/lule_base.png" alt="Lule Base">
                            <h3 style="color: #ff4757;">Lule</h3>
                            <div class="placar-vitorias">${vitL}</div>
                            <span style="color:#aaa; font-size:0.9rem;">Vitórias</span>
                        </div>
                        <div class="vs-text">VS</div>
                        <div class="card-lutador card-b">
                            <img src="imagens/bozo_base.png" alt="Bozo Base">
                            <h3 style="color: #2ed573;">Bozo</h3>
                            <div class="placar-vitorias">${vitB}</div>
                            <span style="color:#aaa; font-size:0.9rem;">Vitórias</span>
                        </div>
                    </div>
                `;
                return;
            }

            if (modo === 'rank_vencedores') {
                document.getElementById('ranking-title').innerHTML = "🏆 TOP JOGADORES (VENCEDORES)";

                let vitoriasJogadores = dataDict.vencedores || {};
                const arrayOrdenado = Object.entries(vitoriasJogadores).sort((a, b) => (b[1].total || 0) - (a[1].total || 0)).slice(0, 10);

                if (arrayOrdenado.length === 0) {
                    lista.innerHTML = '<div style="text-align:center; padding: 40px; font-size: 2rem; color: #888;">Ainda não há registros de vitórias!</div>';
                    return;
                }

                arrayOrdenado.forEach((item, index) => {
                    const nick = item[0];
                    const stats = item[1]; // Ex: { total: 5, vit_l: 3, vit_b: 2, avatar: url }
                    const pos = index + 1;

                    let medalha = pos;
                    if(pos===1) medalha = '🥇';
                    if(pos===2) medalha = '🥈';
                    if(pos===3) medalha = '🥉';

                    let ladoFavorito = (stats.vit_l || 0) >= (stats.vit_b || 0) ?
                        `<span class="rank-side-badge side-l">🔴 L (${stats.vit_l || 0})</span>` :
                        `<span class="rank-side-badge side-b">🟢 B (${stats.vit_b || 0})</span>`;

                    let avatarUrl = stats.avatar || `https://api.dicebear.com/7.x/bottts/svg?seed=${nick}`;

                    const div = document.createElement('div');
                    div.className = `rank-item pos-${pos}`;

                    div.innerHTML = `
                        <div class="rank-pos">${medalha}</div>
                        <img class="rank-avatar" src="${avatarUrl}">
                        <div class="rank-name">${nick}</div>
                        ${ladoFavorito}
                        <div class="rank-score">${stats.total || 0} V</div>
                    `;
                    lista.appendChild(div);
                });
            }
        }

        function processarEventoDaAPI(d) {
            let evento = d.event;
            let dados = d.data;
            if(!dados) return;

            let nick = (dados.nickname || dados.uniqueId || "").trim();
            let avatar_url = dados.profilePictureUrl || `https://api.dicebear.com/7.x/bottts/svg?seed=${nick}`;
            let cfg = jogo.config || {};

            // Processa Taps (Likes) para Ataque 1
            if (evento === "like") {
                let taps = parseInt(dados.likeCount || dados.likes || 1);
                let metaTaps = cfg.taps_ataque || 200;

                estadoLuta.taps_lule += taps;
                if (estadoLuta.taps_lule >= metaTaps) {
                    estadoLuta.taps_lule = 0;
                    estadoLuta.ajudante_lule = { nick: nick, avatar: avatar_url };
                    aplicarDano('bozo', 1);
                }
            }

            // Processa Presentes (Gifts)
            if (evento === "gift") {
                let nomeGiftOriginal = dados.giftName || "";
                let pres = nomeGiftOriginal.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "");

                // Quantidade do combo
                let comboCount = parseInt(dados.repeatCount || dados.comboCount || dados.giftCount || dados.repeat_count || 1);
                if (isNaN(comboCount) || comboCount < 1) comboCount = 1;

                // Captura a URL da imagem do presente vinda do TikFinity / API
                let giftImg = dados.giftPictureUrl || dados.giftImage || dados.giftIcon || dados.iconUrl || "";
                if (giftImg) salvarIconePresente(nomeGiftOriginal, giftImg);

                // Mapeamento Lule
                let l_atk1 = (cfg.pres_atk1_l || "rosa").toLowerCase(); let l_atk2 = (cfg.pres_atk2_l || "sorvete").toLowerCase();
                let l_atk3 = (cfg.pres_atk3_l || "peso").toLowerCase(); let l_atk4 = (cfg.pres_atk4_l || "tiktok").toLowerCase();
                let l_max  = (cfg.pres_max_l  || "coracao").toLowerCase(); let l_cura = (cfg.pres_cura_l || "panda").toLowerCase();

                let atacouL = false, videoL = null, danoBaseL = 0;
                if (pres.includes(l_atk1)) { atacouL = true; danoBaseL = 1; }
                else if (pres.includes(l_atk2)) { atacouL = true; danoBaseL = 10; videoL = 'videos/ataque_L.mp4'; }
                else if (pres.includes(l_atk3)) { atacouL = true; danoBaseL = 50; videoL = 'videos/ataque_51_L.mp4'; }
                else if (pres.includes(l_atk4)) { atacouL = true; danoBaseL = 80; videoL = 'videos/ataque_roubou_L.mp4'; }
                else if (pres.includes(l_max))  { atacouL = true; danoBaseL = 300; videoL = 'videos/maximo_L.mp4'; }
                else if (pres.includes(l_cura)) {
                    estadoLuta.ajudante_lule = { nick, avatar: avatar_url };
                    aplicarCura('lule', 30 * comboCount);
                }

                if (atacouL) {
                    estadoLuta.ajudante_lule = { nick: nick, avatar: avatar_url };
                    let danoTotalL = danoBaseL * comboCount;

                    if (videoL) {
                        if (estadoLuta.emVideo) {
                            aplicarDano('bozo', danoTotalL);
                        } else {
                            tocarVideoAtaque(videoL, danoTotalL, 'bozo');
                        }
                    } else {
                        aplicarDano('bozo', danoTotalL);
                    }
                    return;
                }

                // Mapeamento Bozo
                let b_atk1 = (cfg.pres_atk1_b || "rosa").toLowerCase(); let b_atk2 = (cfg.pres_atk2_b || "sorvete").toLowerCase();
                let b_atk3 = (cfg.pres_atk3_b || "peso").toLowerCase(); let b_atk4 = (cfg.pres_atk4_b || "tiktok").toLowerCase();
                let b_max  = (cfg.pres_max_b  || "coracao").toLowerCase(); let b_cura = (cfg.pres_cura_b || "panda").toLowerCase();

                let atacouB = false, videoB = null, danoBaseB = 0;
                if (pres.includes(b_atk1)) { atacouB = true; danoBaseB = 1; }
                else if (pres.includes(b_atk2)) { atacouB = true; danoBaseB = 10; videoB = 'videos/motociataB.mp4'; }
                else if (pres.includes(b_atk3)) { atacouB = true; danoBaseB = 50; videoB = 'videos/Coronga_B.mp4'; }
                else if (pres.includes(b_atk4)) { atacouB = true; danoBaseB = 80; videoB = 'videos/7desetembro_B.mp4'; }
                else if (pres.includes(b_max))  { atacouB = true; danoBaseB = 300; videoB = 'videos/maximo_B.mp4'; }
                else if (pres.includes(b_cura)) {
                    estadoLuta.ajudante_bozo = { nick, avatar: avatar_url };
                    aplicarCura('bozo', 30 * comboCount);
                }

                if (atacouB) {
                    estadoLuta.ajudante_bozo = { nick: nick, avatar: avatar_url };
                    let danoTotalB = danoBaseB * comboCount;

                    if (videoB) {
                        if (estadoLuta.emVideo) {
                            aplicarDano('lule', danoTotalB);
                        } else {
                            tocarVideoAtaque(videoB, danoTotalB, 'lule');
                        }
                    } else {
                        aplicarDano('lule', danoTotalB);
                    }
                    return;
                }
            }
        }

        function verificarFimDeLuta() {
            if (estadoLuta.hp_lule <= 0 || estadoLuta.hp_bozo <= 0) {
                let ladoVencedor = estadoLuta.hp_lule > 0 ? 'lule' : 'bozo';
                let ajudante = ladoVencedor === 'lule' ? estadoLuta.ajudante_lule : estadoLuta.ajudante_bozo;

                // Atualiza o ranking com o lado vitorioso e o jogador que finalizou
                addRanking(ladoVencedor, ajudante.nick, ajudante.avatar);

                exibirVencedor({
                    nick: `GOLPE FINAL: ${ajudante.nick}`,
                    avatar: ajudante.avatar,
                    tempo: 0,
                    palavras: []
                });

                // Reinicia a luta após 8 segundos
                setTimeout(() => {
                    estadoLuta.hp_lule = 1000;
                    estadoLuta.hp_bozo = 1000;
                    atualizarHUDLuta();
                }, 8000);
            }
        }

        // Toca provocações em áudio aleatórias a cada 15 segundos se não estiver em vídeo
        setInterval(() => {
            if (estadoLuta.emVideo) return;
            let agora = Date.now();
            if (agora - estadoLuta.ultimoSomTaunt > 15000) {
                estadoLuta.ultimoSomTaunt = agora;
                let listaSons = [...sonsTauntL, ...sonsTauntB];
                let somSorteado = listaSons[Math.floor(Math.random() * listaSons.length)];
                let audio = new Audio(somSorteado);
                audio.play().catch(e => console.log("Erro audio taunt: ", e));
            }
        }, 5000);

        // 🏆 SISTEMA DE MEMÓRIA DOS RANKINGS (NOVO)
        let espectadoresRecentes = {};

        function getPeriodos() {
            const d = new Date(); const dia = d.toISOString().split('T')[0]; const mes = dia.substring(0, 7);
            const d0 = new Date(d.getFullYear(), 0, 1);
            const semana = d.getFullYear() + '-W' + Math.ceil((((d - d0) / 86400000) + d0.getDay() + 1) / 7);
            return { diario: dia, semanal: semana, mensal: mes, geral: 'geral' };
        }

        function checkRankingResets(rankings) {
            let p = getPeriodos(); let changed = false;
            if (rankings.id_diario !== p.diario) { rankings.diario = {lule:0, bozo:0, vencedores:{}}; rankings.id_diario = p.diario; changed = true; }
            if (rankings.id_semanal !== p.semanal) { rankings.semanal = {lule:0, bozo:0, vencedores:{}}; rankings.id_semanal = p.semanal; changed = true; }
            if (rankings.id_mensal !== p.mensal) { rankings.mensal = {lule:0, bozo:0, vencedores:{}}; rankings.id_mensal = p.mensal; changed = true; }
            return changed;
        }

        function addRanking(ladoVencedor, nickVencedor, avatarVencedor) {
            let rStr = localStorage.getItem('bombaRankings');
            let rankings = rStr ? JSON.parse(rStr) : {
                id_diario: '', id_semanal: '', id_mensal: '',
                diario: {lule:0, bozo:0, vencedores:{}}, semanal: {lule:0, bozo:0, vencedores:{}},
                mensal: {lule:0, bozo:0, vencedores:{}}, geral: {lule:0, bozo:0, vencedores:{}}
            };
            checkRankingResets(rankings);

            ['diario', 'semanal', 'mensal', 'geral'].forEach(periodo => {
                if(!rankings[periodo]) rankings[periodo] = {lule:0, bozo:0, vencedores:{}};

                // +1 Vitória para o Personagem (Lule ou Bozo)
                rankings[periodo][ladoVencedor] = (rankings[periodo][ladoVencedor] || 0) + 1;

                // +1 Vitória para o Jogador que finalizou
                if (!rankings[periodo].vencedores) rankings[periodo].vencedores = {};
                if (!rankings[periodo].vencedores[nickVencedor]) {
                    rankings[periodo].vencedores[nickVencedor] = { total: 0, vit_l: 0, vit_b: 0, avatar: avatarVencedor };
                }

                rankings[periodo].vencedores[nickVencedor].total += 1;
                rankings[periodo].vencedores[nickVencedor].avatar = avatarVencedor;

                if (ladoVencedor === 'lule') {
                    rankings[periodo].vencedores[nickVencedor].vit_l += 1;
                } else {
                    rankings[periodo].vencedores[nickVencedor].vit_b += 1;
                }
            });

            localStorage.setItem('bombaRankings', JSON.stringify(rankings));
            if (typeof window.fbcPushRankings === "function") window.fbcPushRankings(rankings);
        }

        function atualizarTela() {
            if (jogo.config.volume_explosao !== undefined) audioExplosaoMp3.volume = jogo.config.volume_explosao;

            if (jogo.config.bg_type === 'transparent') {
                document.body.style.backgroundImage = 'none'; document.body.style.backgroundColor = 'transparent';
            } else if (jogo.config.bg_type === 'color') {
                document.body.style.backgroundImage = 'none'; document.body.style.backgroundColor = jogo.config.bg_value;
            } else if (jogo.config.bg_type === 'image') {
                document.body.style.backgroundColor = 'transparent'; document.body.style.backgroundImage = `url('${jogo.config.bg_value}')`;
            }

            if (jogo.config.zoom_level !== undefined) {
                zoomLevel = jogo.config.zoom_level;
                document.getElementById('game-zoom-area').style.transform = `scale(${zoomLevel})`;
            }

            if (document.getElementById('tela-vencedor').classList.contains('show')) return;

            // Se for para mostrar o Ranking
            if (jogo.display_mode && jogo.display_mode !== 'game') {
                document.getElementById('ranking-view').style.display = 'flex';
                document.getElementById('game-zoom-area').style.display = 'none';

                let rStr = localStorage.getItem('bombaRankings');
                let rankings = rStr ? JSON.parse(rStr) : null;

                let per = jogo.display_periodo || 'diario';
                let nomePer = "RANKING DE HOJE";
                if(per === "semanal") nomePer = "RANKING DA SEMANA";
                if(per === "mensal") nomePer = "RANKING DESTE MÊS";
                if(per === "geral") nomePer = "RANKING GERAL (HISTÓRICO)";

                let dataDict = (rankings && rankings[per]) ? rankings[per] : { lule: 0, bozo: 0, vencedores: {} };
                renderizarRankingUI(jogo.display_mode, dataDict, nomePer);
            } else {
                // Se for para mostrar o Jogo
                document.getElementById('ranking-view').style.display = 'none';
                document.getElementById('game-zoom-area').style.display = 'block';
            }
        }

        // O RELÓGIO PRINCIPAL (Verifica Licença RDM e Comandos do Painel)
        setInterval(() => {
            // ⏱️ CHECAGEM DE LICENÇA EM TEMPO REAL RDM
            if (window.rdmPerfil === "gratuito" || window.rdmPerfil === "plus premium") {
                let horaAtual = Date.now();
                if (!window.rdmSessaoIniciada) window.rdmSessaoIniciada = horaAtual;

                let tempoDecorridoMs = horaAtual - window.rdmSessaoIniciada;
                let limiteMs = (window.rdmPerfil === "gratuito") ? (2 * 60 * 60 * 1000) : (42 * 60 * 60 * 1000);

                if (tempoDecorridoMs >= limiteMs) {
                    let blockScreen = document.getElementById('rdm-block-screen');
                    if (!blockScreen) {
                        blockScreen = document.createElement('div');
                        blockScreen.id = 'rdm-block-screen';
                        blockScreen.style.cssText = 'position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.95); z-index:9999; display:flex; flex-direction:column; justify-content:center; align-items:center;';
                        blockScreen.innerHTML = `<h1 style='color:#facc15; font-size:40px; text-shadow:0 0 20px #facc15;'>⏱️ TEMPO ESGOTADO!</h1><p style='color:white; font-size:20px;'>A carga de horas do seu plano atual chegou ao fim. Faça um upgrade no site RDM Studio.</p>`;
                        document.body.appendChild(blockScreen);
                        if (wsNuvem) wsNuvem.close();
                        if (wsTikfinity) wsTikfinity.close();
                    }
                    return;
                }
            }

            // Escuta os comandos vindos do Painel do Host
            let cmdStr = localStorage.getItem('bombaCommand');
            if (cmdStr) {
                let cmd = JSON.parse(cmdStr);
                if (cmd.ts !== jogo.lastCmdTs) {
                    jogo.lastCmdTs = cmd.ts;

                    if (cmd.action === 'display_mode') {
                        jogo.display_mode = cmd.value;
                        atualizarTela();
                    }
                    if (cmd.action === 'display_periodo') {
                        jogo.display_periodo = cmd.value;
                        atualizarTela();
                    }
                    if (cmd.action === 'limpar_diario') {
                        let rStr = localStorage.getItem('bombaRankings');
                        let rankings = rStr ? JSON.parse(rStr) : null;
                        if(rankings) {
                            rankings.diario = {lule:0, bozo:0, vencedores:{}};
                            localStorage.setItem('bombaRankings', JSON.stringify(rankings));
                            if (typeof window.fbcPushRankings === "function") window.fbcPushRankings(rankings);
                        }
                    }
                    if (cmd.action === 'update_bg') {
                        atualizarConfig();
                        atualizarTela();
                    }
                }
            }
        }, 1000);

        window.addEventListener('resize', () => window.dispatchEvent(new Event('redraw')));



        // ==========================================
        // 📡 PARTE 3: ANTENA HÍBRIDA INTELIGENTE (PRIORIDADE TIKFINITY)
        // ==========================================
        let conexaoNuvemEstabelecida = false;
        let wsNuvem = null;
        let wsTikfinity = null;
        let lastTiktokUser = "";

        function conectarNuvem() {
            let targetUser = window.rdmUser;
            if (!targetUser) return;

            if (conexaoNuvemEstabelecida && lastTiktokUser === targetUser) return;

            // ⚠️ A CORREÇÃO DE LOOP: Impede que o jogo cancele a conexão enquanto a torre acorda!
            if (wsNuvem && wsNuvem.readyState === WebSocket.CONNECTING) {
                return;
            }

            if (wsNuvem) wsNuvem.close();

            lastTiktokUser = targetUser;
            console.log(`☁️ Tentando Nuvem para: @${targetUser}... (Aguardando resposta)`);

            wsNuvem = new WebSocket("wss://torre-de-controle-rdm.onrender.com:443/");

            wsNuvem.onopen = () => {
                conexaoNuvemEstabelecida = true;
                console.log(`✅ NUVEM CONECTADA! Escutando: @${targetUser}`);

                // 🪄 A LINHA MÁGICA: Diz à API qual live espelhar!
                wsNuvem.send(JSON.stringify({ action: "connect", tiktok_user: targetUser }));

                // ⚠️ A PROVA VISUAL NO BOMBA BOMBA
                mostrarAviso(`☁️ NUVEM LIGADA! (@${targetUser})`);
            };

            wsNuvem.onmessage = (event) => {
                try { processarEventoDaAPI(JSON.parse(event.data)); } catch(e) {}
            };

            wsNuvem.onclose = () => { conexaoNuvemEstabelecida = false; wsNuvem = null; };
        }

        function verificarEConectar() {
            // Tenta priorizar o TikFinity Local!
            if (!wsTikfinity || wsTikfinity.readyState === WebSocket.CLOSED) {
                wsTikfinity = new WebSocket("ws://127.0.0.1:21213/");

                wsTikfinity.onopen = () => {
                    console.log("✅ TikFinity Local Conectado!");
                    // Se o TikFinity conectou, desliga a Nuvem para não duplicar os presentes
                    if (wsNuvem) { wsNuvem.close(); wsNuvem = null; conexaoNuvemEstabelecida = false; }
                };

                wsTikfinity.onmessage = (event) => {
                    try { processarEventoDaAPI(JSON.parse(event.data)); } catch(e) {}
                };

                wsTikfinity.onerror = () => {
                    // Se o TikFinity der erro (ex: programa fechado), aciona a Nuvem com o @ do site
                    conectarNuvem();
                };

                wsTikfinity.onclose = () => { wsTikfinity = null; };
            } else if (wsTikfinity.readyState === WebSocket.OPEN) {
                if (wsNuvem) { wsNuvem.close(); wsNuvem = null; conexaoNuvemEstabelecida = false; }
            }
        }

        // 📡 TENTA SEMPRE O TIKFINITY PRIMEIRO (Mesmo no OBS/TikTok Studio)
        // Se o TikFinity falhar ou estiver fechado, ele pede socorro à Nuvem automaticamente!
        setInterval(verificarEConectar, 2000);
    </script>

        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = { apiKey: "AIzaSyB2LNWktWEwYLuZxwr8oc9NpcjFz3GU5qc", authDomain: "authrdm-a82a6.firebaseapp.com", databaseURL: "https://authrdm-a82a6-default-rtdb.firebaseio.com", projectId: "authrdm-a82a6" };
        const app = initializeApp(firebaseConfig); const db = getDatabase(app);

        const urlParams = new URLSearchParams(window.location.search);
        const rdmUser = urlParams.get('u') || window.rdmUser || "visitante";
